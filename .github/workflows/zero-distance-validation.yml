name: Zero-distance validation
on:
  push:
    branches: [ci/zero-distance-validation]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        revision: [b85ffaf98ee23643f268efd131b4af2fc656f861, e95e0f9ab2ddc994d8c3d23962590360cc9068a0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.5
      - name: Record revision and runtime
        run: |
          git rev-parse HEAD
          go version
      - name: Test with race detector
        run: go test ./... -race -cover -shuffle=1776 -count=1
      - name: Vet
        if: always()
        run: go vet ./...
      - name: Build
        if: always()
        run: go build ./...
