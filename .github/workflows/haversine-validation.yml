name: Haversine Linux validation
on:
  push:
    branches: [ci/haversine-antipodal-validation]
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.label }} / Linux amd64 / Go 1.25.5
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            ref: b85ffaf98ee23643f268efd131b4af2fc656f861
          - label: fixed
            ref: f28db62396d58b130204df7e4964fe6656e75c9b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - name: Record environment
        run: |
          git rev-parse HEAD
          go version
          go env GOOS GOARCH
      - name: Full race and coverage suite
        run: go test ./... -race -cover -count=1
      - name: Vet and build
        run: |
          go vet ./...
          go build ./...
